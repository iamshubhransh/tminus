name: Release

# Push a tag like v0.2.0 (matching packages/cli/package.json) to publish.
# npm auth: either configure Trusted Publishing for this workflow on npmjs.com
# (no secret needed), or add an npm automation token as the NPM_TOKEN secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted-publishing support
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun run build
      - run: bun test
        env:
          TMINUS_RENDER_BUDGET_MS: 60 # see ci.yml
      - run: scripts/smoke-pack.sh

      - name: Tag must match the package version
        id: version
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "tminus@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Already on npm
        if: steps.version.outputs.published == 'true'
        run: echo "tminus@${{ steps.version.outputs.version }} is already on npm; skipping publish."

      - name: GitHub release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "tminus $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
